[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kubernetes-change-sentinel"
version = "1.0.0"
description = "Deterministic, approval-first risk analysis for Kubernetes manifest changes"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Jeffrey Ikuoyemwen"}]

[project.scripts]
kubernetes-change-sentinel = "kubernetes_change_sentinel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

