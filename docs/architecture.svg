    <text x="195" y="410" text-anchor="middle" font-size="18" fill="#64708a">Before + after JSON</text>

    <rect x="415" y="235" width="300" height="260" rx="22" fill="#17213c"/>
    <circle cx="565" cy="280" r="25" fill="#445bd9"/>
    <text x="565" y="288" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">2</text>
    <text x="565" y="336" text-anchor="middle" font-size="27" font-weight="700" fill="#ffffff">Policy engine</text>
    <text x="565" y="377" text-anchor="middle" font-size="18" fill="#c7d0ec">RBAC • privilege • network</text>
    <text x="565" y="410" text-anchor="middle" font-size="18" fill="#c7d0ec">images • limits • replicas</text>
    <rect x="480" y="444" width="170" height="28" rx="14" fill="#2c3657"/>
    <text x="565" y="464" text-anchor="middle" font-size="15" font-weight="700" fill="#92a3ff">READ ONLY</text>

    <rect x="810" y="275" width="250" height="180" rx="22" fill="#ffffff" stroke="#cbd3e6" stroke-width="3"/>
    <circle cx="935" cy="318" r="25" fill="#e8edff"/>
    <text x="935" y="326" text-anchor="middle" font-size="24" font-weight="700" fill="#445bd9">3</text>
    <text x="935" y="372" text-anchor="middle" font-size="26" font-weight="700" fill="#17213c">Risk report</text>
    <text x="935" y="410" text-anchor="middle" font-size="18" fill="#64708a">PASS • REVIEW • BLOCK</text>

    <rect x="1155" y="275" width="175" height="180" rx="22" fill="#fff8e7" stroke="#e3b341" stroke-width="3"/>
    <circle cx="1242" cy="318" r="25" fill="#ffe5a6"/>
    <text x="1242" y="326" text-anchor="middle" font-size="24" font-weight="700" fill="#8a5d00">4</text>
    <text x="1242" y="369" text-anchor="middle" font-size="24" font-weight="700" fill="#593f0a">Human</text>
    <text x="1242" y="400" text-anchor="middle" font-size="24" font-weight="700" fill="#593f0a">approval</text>

    <path d="M320 365 H398" stroke="#445bd9" stroke-width="6" fill="none"/>
    <path d="M385 350 L407 365 L385 380" fill="#445bd9"/>
    <path d="M715 365 H793" stroke="#445bd9" stroke-width="6" fill="none"/>
    <path d="M780 350 L802 365 L780 380" fill="#445bd9"/>
    <path d="M1060 365 H1138" stroke="#e3b341" stroke-width="6" fill="none"/>
    <path d="M1125 350 L1147 365 L1125 380" fill="#e3b341"/>

    <rect x="335" y="575" width="730" height="96" rx="18" fill="#e9f8f0"/>
    <text x="700" y="614" text-anchor="middle" font-size="22" font-weight="700" fill="#17603d">Safety boundary</text>
    <text x="700" y="647" text-anchor="middle" font-size="18" fill="#2f6f53">No cluster credentials • no kubectl apply • no autonomous remediation</text>
