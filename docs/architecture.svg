<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800">
  <rect width="1400" height="800" fill="#f7f8fc"/>
  <text x="700" y="92" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="700" fill="#17213c">Kubernetes Change Sentinel</text>
  <text x="700" y="136" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" fill="#64708a">Deterministic review before a manifest reaches the cluster</text>

  <g font-family="Inter,Arial,sans-serif">
    <rect x="70" y="275" width="250" height="180" rx="22" fill="#ffffff" stroke="#cbd3e6" stroke-width="3"/>
    <circle cx="195" cy="318" r="25" fill="#e8edff"/>
